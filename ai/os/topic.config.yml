---
# The agentic OS: the entrypoint (~/os) and the plumbing that keeps the
# vaults' wiki (checkpoints, the sweeper, the usage report, the schema every
# vault imports). The vaults themselves are tools/obsidian's; work items are
# dev/wk's; Claude Code's own configuration is ai/claude's.
os_config:
  path: ai/os
  links:
    - src: os/CLAUDE.md
      dest: "{{ os_home }}/"
      rename: CLAUDE.md
    - src: os/settings.json
      dest: "{{ os_home }}/.claude/"
      rename: settings.json
    - src: wiki_checkpoint.sh
      dest: "{{ xdg_bin_home }}/"
      rename: wiki_checkpoint
    - src: wiki-schema.md
      dest: "{{ claude_home }}/"
    - src: skills/wiki-checkpoint
      dest: "{{ claude_home }}/skills/"
      rename: wiki-checkpoint
    - src: systemd/wiki-sweep.service
      dest: "{{ xdg_config_home }}/systemd/user/"
      rename: wiki-sweep.service
      condition: "{{ is_arch }}"
    - src: systemd/wiki-sweep.timer
      dest: "{{ xdg_config_home }}/systemd/user/"
      rename: wiki-sweep.timer
      condition: "{{ is_arch }}"
    - src: systemd/wiki-usage.service
      dest: "{{ xdg_config_home }}/systemd/user/"
      rename: wiki-usage.service
      condition: "{{ is_arch }}"
    - src: systemd/wiki-usage.timer
      dest: "{{ xdg_config_home }}/systemd/user/"
      rename: wiki-usage.timer
      condition: "{{ is_arch }}"

os_home: "~/os"
