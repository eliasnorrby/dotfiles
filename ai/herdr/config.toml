onboarding = false
# herdr configuration, tuned to mirror the tmux setup in shell/tmux.
# Full reference: herdr --default-config
# Apply changes to a running server: herdr server reload-config

[theme]
name = "catppuccin"

auto_switch = false
[keys]
prefix = "ctrl+space"

detach = "prefix+d"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

workspace_picker = "prefix+w"

zoom = "prefix+space"

[keys.indexed]
tabs = "alt"

[ui.toast]
delivery = "system"

[session]
resume_agents_on_restore = true

[ui]
status_indicators = "symbols"
