---
claude_config:
  path: ai/claude
  brew_casks:
    - claude
    - claude-code
  aur_packages:
    - claude-code
  links:
    - src: claude_editor.sh
      dest: "{{ xdg_bin_home }}/"
      rename: claude_editor
    - src: claude_persisted_editor.sh
      dest: "{{ xdg_bin_home }}/"
      rename: claude_persisted_editor
    - src: claude_notification.sh
      dest: "{{ xdg_bin_home }}/"
      rename: claude_notification
    - src: claude_session_title.sh
      dest: "{{ xdg_bin_home }}/"
      rename: claude_session_title
    - src: settings.json
      dest: "{{ claude_home }}/"
    - src: statusline.sh
      dest: "{{ claude_home }}/"
    - src: home-claude.md
      dest: ~/
      rename: CLAUDE.md
    # Skills are linked one by one, so other topics can add theirs and
    # ~/.claude/skills can hold what Claude Code puts there itself.
    - src: skills/address
      dest: "{{ claude_home }}/skills/"
      rename: address
    - src: skills/c
      dest: "{{ claude_home }}/skills/"
      rename: c
    - src: skills/delegate
      dest: "{{ claude_home }}/skills/"
      rename: delegate
    - src: skills/download-plan
      dest: "{{ claude_home }}/skills/"
      rename: download-plan
    - src: skills/grill-me
      dest: "{{ claude_home }}/skills/"
      rename: grill-me
    - src: skills/lg
      dest: "{{ claude_home }}/skills/"
      rename: lg
    - src: skills/upload-plan
      dest: "{{ claude_home }}/skills/"
      rename: upload-plan
    - src: agents
      dest: "{{ claude_home }}/"
    - src: output-styles
      dest: "{{ claude_home }}/"

claude_home: "~/.claude"
