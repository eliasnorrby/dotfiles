# disabled-yaml-language-server: $schema=https://raw.githubusercontent.com/eliasnorrby/which-cmd/main/schema.yml
keys:
  - key: f
    value: fnm
    keys:
      - key: u
        value: use
        keys:
          - key: d
            value: default
            immediate: true
      - key: l
        value: list
        immediate: true
  - key: g
    value: git
    keys:
      - key: .
        name: +scripts
        keys:
          - key: b
            anchor: true
            value: auto_branch_pruner
            name: Prune branches
      - key: s
        value: status
        immediate: true
      - key: d
        value: diff
        immediate: true
      - key: b
        value: branch
        keys:
          - key: m
            name: rename
            value: -m
          - key: p
            name: prune
            anchor: true
            value: auto_branch_pruner
      - key: c
        value: checkout
        keys:
          - key: b
            name: new branch
            value: -b
          - key: "-"
            name: previous branch
            value: "-"
            immediate: true
      - key: p
        value: push
        keys:
          - key: u
            value: -u
            name: set-upstream
            immediate: true
      - key: z
        value: stash
        keys:
          - key: p
            value: push
            loop: true
            keys:
              - key: u
                name: untracked
                value: --include-untracked
              - key: s
                name: staged
                value: --staged
              - key: m
                name: message
                value: -m
                input: Text
          - key: l
            value: list
            immediate: true
          - key: s
            value: show
      - key: r
        value: rebase
        keys:
          - key: i
            name: interactive
            value: -i
          - key: o
            name: origin
            value: origin/master
            immediate: true
          - key: O
            name: onto
            value: --onto
          - key: c
            name: continue
            value: --continue
          - key: a
            name: abort
            value: --abort
      - key: R
        value: reset
        keys:
          - key: h
            value: --hard
      - key: h
        name: GitHub
        value: gh
        anchor: true
        keys:
          - key: p
            name: pull request
            value: pr
            keys:
              - key: c
                value: create
                immediate: true
              - key: C
                value: checkout
              - key: k
                value: checks
                keys:
                  - key: w
                    value: --watch
                    keys:
                      - key: n
                        value: ; notify_me
                        name: notify
              - key: m
                value: merge
                loop: true
                keys:
                  - key: s
                    value: --squash
                    name: Squash
                  - key: a
                    value: --admin
                    name: Use admin privileges
              - key: v
                value: view
                immediate: true
              - key: l
                value: list
                immediate: true
              - key: e
                value: edit
                immediate: true
          - key: b
            value: browse
            immediate: true
  - key: D
    value: date
    keys:
      - key: t
        name: to unix
        value: +%s -d
      - key: f
        name: from unix
        value: -d @
      - key: n
        name: now
        value: +%s
        immediate: true
  - key: l
    value: ls
    loop: true
    keys:
      - key: l
        name: long
        value: -l
      - key: a
        name: all
        value: -a
      - key: r
        name: recursive
        value: -R
  - key: j
    name: jest
    value: pnpm jest
    keys:
      - key: t
        name: filter by test name
        value: -t
  - key: C
    value: curl
    loop: true
    keys:
      - key: h
        name: header
        value: -H
        fleeting: true
        repeatable: true
        keys:
          - key: c
            name: ContentType
            value: '"ContentType:'
            fleeting: true
            keys:
              - key: a
                name: application/json
                value: 'application/json"'
      - key: x
        name: method
        value: -X
        keys:
          - key: p
            value: POST
          - key: P
            value: PUT
          - key: g
            value: GET
          - key: o
            value: OPTION
          - key: d
            value: DELETE
  - key: c
    value: cargo
    keys:
      - key: r
        value: run
      - key: b
        value: build
        immediate: true
      - key: t
        value: test
        immediate: true
      - key: f
        name: format
        value: fmt
        immediate: true
      - key: c
        name: lint
        value: clippy
        immediate: true
  - key: d
    value: docker
    keys:
      - key: i
        value: image
        keys:
          - key: l
            value: ls
            immediate: true
          - key: p
            value: prune
      - key: c
        value: compose
        keys:
          - key: u
            value: up
          - key: d
            value: down
      - key: C
        value: container
        keys:
          - key: l
            value: ls
            immediate: true
          - key: p
            value: prune
      - key: s
        value: system
        keys:
          - key: p
            value: prune
      - key: r
        value: run
        loop: true
        keys:
          - key: i
            value: -it
            name: interactive
          - key: r
            value: --rm
            name: remove
          - key: e
            value: --env
            name: environment variable
            input: Text
            repeatable: true
      - key: p
        value: ps
        immediate: true
  - key: F
    name: find
    value: find .
    loop: true
    keys:
      - key: t
        value: -type
        fleeting: true
        keys:
          - key: f
            name: file
            value: f
          - key: d
            name: directory
            value: d
  - key: x
    value: cut
    loop: true
    keys:
      - key: d
        name: delimiter
        value: -d
        input: Text
      - key: f
        name: field
        # TODO: make narrow (don't add space after)
        value: -f
        input: Number
  - key: r
    value: rg
    loop: true
    keys:
      - key: h
        name: hidden
        value: --hidden
      - key: i
        name: ignore case
        value: --ignore-case
      - key: v
        name: invert
        value: --invert-match
      - key: m
        name: max count
        value: --max-count
        input: Number
      - key: d
        name: max depth
        value: --max-depth
        input: Number
  - key: p
    value: pnpm
    keys:
      - key: d
        value: dev
        loop: true
        keys:
          - key: p
            value: --with-pusher
          - key: s
            value: --with-scheduling
          - key: q
            value: --log-prisma-queries
          - key: t
            value: --tz
            choices:
              - Europe/Stockholm
              - America/New_York
      - key: i
        value: install
        immediate: true
      - key: a
        value: add
        loop: true
        keys:
          - key: d
            name: development
            value: -D
      - key: x
        value: dlx
  - key: t
    value: terraform
    keys:
      - key: p
        value: plan
      - key: i
        value: init
      - key: v
        value: validate
      - key: f
        value: fmt
        immediate: true
  - key: b
    value: brew
    keys:
      - key: i
        value: install
      - key: I
        value: info
      - key: l
        value: leaves
        immediate: true
      - key: u
        value: upgrade
  - key: k
    value: kubectl
    loop: true
    keys:
      # TODO: Consider global keys for a tree
      - key: "-"
        name: "[options]"
        repeatable: true
        keys:
          # FIX: - should be repeatable, but n shouldn't
          - key: n
            value: --namespace
            input: Text
      - key: g
        value: get
        keys:
          - key: p
            value: pods
          - key: s
            value: svc
          - key: n
            value: nodes
          - key: a
            value: all
          - key: N
            value: namespaces
      - key: d
        value: describe
        keys:
          - key: p
            value: pod
          - key: s
            value: svc
          - key: n
            value: node
      - key: e
        value: edit
      - key: a
        value: apply
        keys:
          - key: f
            value: -f
      - key: D
        value: delete
        keys:
          - key: p
            value: pod
          - key: s
            value: svc
          - key: N
            value: namespace
          - key: f
            value: -f
      - key: E
        value: exec -it
      - key: l
        value: logs
        keys:
          - key: f
            value: -f
      - key: p
        value: port-forward
      - key: t
        value: top
        keys:
          - key: p
            value: pod
  - key: n
    name: nest
    value: pnpm exec nest
    keys:
      - key: n
        name: new
        anchor: true
        value: pnpx @nestjs/cli new
      - key: g
        value: generate --no-spec
        name: generate
        keys: &schematics
          - key: s
            value: service
          - key: c
            value: controller
          - key: m
            value: module
          - key: C
            value: class
      - key: G
        name: generate (with spec)
        value: generate
        keys: *schematics
  - key: P
    name: prisma
    value: pnpm exec prisma
    keys:
      - key: m
        value: migrate
        keys:
          - key: d
            value: dev
      - key: g
        value: generate
      - key: G
        value: generate --watch
  - key: w
    name: window
    keys:
      - key: v
        name: vertical split
        value: tmux split-window -h
        immediate: true
      - key: s
        name: horizontal split
        value: tmux split-window -v
        immediate: true
