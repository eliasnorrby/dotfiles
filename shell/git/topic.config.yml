---
git_config:
  path: shell/git
  links:
    - config
    - attributes
    - aliases
    - config-bemlo
    - config-notes
    - ignore
    - src: gh-config.yml
      dest: "{{ xdg_config_home }}/gh/"
      rename: config.yml
    - src: gh_browse.sh
      dest: "{{ xdg_bin_home }}/"
      rename: gh_browse
    - src: gh_browse_pull.sh
      dest: "{{ xdg_bin_home }}/"
      rename: gh_browse_pull
    - src: branch_status.sh
      dest: "{{ xdg_bin_home }}/"
      rename: branch_status
    - src: list_branch_files.sh
      dest: "{{ xdg_bin_home }}/"
      rename: list_branch_files
    - src: list_ancestor_branches.sh
      dest: "{{ xdg_bin_home }}/"
      rename: list_ancestor_branches
    - src: watch_branches.sh
      dest: "{{ xdg_bin_home }}/"
      rename: watch_branches
    - src: fuzzy_branch.sh
      dest: "{{ xdg_bin_home }}/"
      rename: fuzzy_branch
    - src: fuzzy_worktree.sh
      dest: "{{ xdg_bin_home }}/"
      rename: fuzzy_worktree
    # Sourced (not run) by fuzzy_worktree / tmux_start_work via `command -v`.
    - src: worktree_lib.sh
      dest: "{{ xdg_bin_home }}/"
      rename: worktree_lib.sh
    - src: branch_pruner.sh
      dest: "{{ xdg_bin_home }}/"
      rename: branch_pruner
    - src: auto_branch_pruner.sh
      dest: "{{ xdg_bin_home }}/"
      rename: auto_branch_pruner
    - src: auto_worktree_pruner.sh
      dest: "{{ xdg_bin_home }}/"
      rename: auto_worktree_pruner
    - src: linear_issue_number.sh
      dest: "{{ xdg_bin_home }}/"
      rename: linear_issue_number
    - src: open_linear_issue.sh
      dest: "{{ xdg_bin_home }}/"
      rename: open_linear_issue
    - src: issue_resolve.sh
      dest: "{{ xdg_bin_home }}/"
      rename: issue_resolve
    - src: branch_todos.sh
      dest: "{{ xdg_bin_home }}/"
      rename: branch_todos
    - src: prdash.sh
      dest: "{{ xdg_bin_home }}/"
      rename: prdash
  brew_formulae:
    - git
    - tig
    - hub
    - gh
    - diff-so-fancy
    - git-delta
    - grip
    # git-flow-avh
  pacman_packages:
    - git
    - tig
    - hub
    - github-cli
    - diff-so-fancy
    - git-delta
  aur_packages:
    - python-grip
    - hunk-bin
