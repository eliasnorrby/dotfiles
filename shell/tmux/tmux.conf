set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",${TERM}:RGB"

# =============================================================================
# = Movement, splitting and resizing  =========================================
# =============================================================================

# Split panes using | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Emacs like bindings
bind v split-window -h -c "#{pane_current_path}"

bind | split-window -h -l 20% -c "#{pane_current_path}"
bind _ split-window -v -l 20% -c "#{pane_current_path}"

unbind '"'
unbind %

# For resizing
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 15
bind-key -r C-h resize-pane -L 15
setw -g aggressive-resize on

bind-key SPACE resize-pane -Z

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Alternate solution?
# https://thoughtbot.com/blog/seamlessly-navigate-vim-and-tmux-splits

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5
bind-key -n F6 select-window -t 6
bind-key -n F7 select-window -t 7
bind-key -n F8 select-window -t 8

# =============================================================================
# = Special behavior ==========================================================
# =============================================================================
set -g renumber-windows on  # renumber windows when a window is closed

# Reduce time to register ESC
set -s escape-time 0

# To make autoread work in vim
set-option -g focus-events on

# Do not automatically name windows
set-window-option -g automatic-rename off
set-option -g set-titles off

bind c {
  new-window -c "#{pane_current_path}"
  command-prompt -p " Window name:" -I "#{window_name}" "rename-window '%%'"
}
bind z {
  new-window
  command-prompt -p " Window name:" "rename-window '#{?#{!=:%1,''},%1,zsh}'
  send-keys z ' %1' C-m"
}
bind Z rename-window "#{b:pane_current_path}"

bind-key C {
  new-session
  command-prompt -p " Session name:" -I "#{session_name}" "rename-session '%%'"
}

# Session switcher popup
bind -n M-s display-popup -b none -T ' Sessions ' -w 30 -h 20 -E "tmux list-sessions -f '#{?#{m:_popup_*,#{session_name}},0,1}' | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# Scratchpad neovim window
bind V new-window -n scratch nvim
# Dotfiles window
bind D new-window -n dotfiles "cd ~/.dotfiles; nvim"
# Open a new window within a temporary directory
bind T new-window -n tmp "cd $(mktemp -d); exec zsh"
# k9s (kubernetes CLI) window
bind K new-window -n k9s "k9s --logoless"
# Open a new window with a bash REPL
bind B new-window -n repl bash_repl
# Matrix screensaver
bind M new-window -n matrix "$TMUX_HOME/scripts/toggle_status.sh && cmatrix -b -u 5 && $TMUX_HOME/scripts/toggle_status.sh"
# Switch to monitoring (btop) session
bind m run-shell 'tmux switch-client -t monitor || tmux new-session -d -s monitor btop && tmux switch-client -t monitor'
# Shell popup
bind k display-popup -E -b rounded -d "#{pane_current_path}" -T 'Shell' zsh
# Display memos
bind H display-popup -b rounded -d "~/.dotfiles" -w '85%' -h '85%' -T "Memos" 'mdcat memos.md'
# Open linear issue
bind i run-shell "cd #{pane_current_path} && open_linear_issue"

bind s display-popup -E -b none -d "#{pane_current_path}" -w '85%' -h '85%' select_and_run_package_script
bind S display-popup -E -d "#{pane_current_path}" -w '85%' -h '85%' 'select_and_run_package_script append'

# = Notes =================================================================
bind C-n new-window -n "notes" "notes_global_entry"
bind C-t set -g 'status-format[0]' "#[align=centre]$ts_tools"
bind C-u set -g 'status-format[0]' ''

# = Git bindings ==========================================================
# Branch selector
bind b display-popup -EE -b none -d "#{pane_current_path}" -w '85%' -h '85%' fuzzy_branch
# Browse GitHub repository
bind G display-popup -E -B -w '85%' -h '85%' -T "Browse GitHub repository" gh_browse
# Open GitHub pull request
bind p run-shell "cd #{pane_current_path} && gh pr view -w"
# Browse GitHub pull requests
bind P display-popup -EE -b rounded -d "#{pane_current_path}" -w '85%' -h '85%' -T "Browse pull requests" gh_browse_pull
# Create GitHub pull request
bind C-p display-popup -E -b rounded -d "#{pane_current_path}" -w '85%' -h '85%' -T "Create pull request"  "gh pr create"

# =============================================================================
# = Special Popups ============================================================
# =============================================================================

# Base popup (terminal)
bind -n M-t run-shell "$TMUX_HOME/scripts/toggle_terminal_popup.sh"
bind -T popup M-t run-shell "$TMUX_HOME/scripts/toggle_terminal_popup.sh"

# Scratch popup (nvim)
bind -n M-d run-shell "$TMUX_HOME/scripts/toggle_scratch_popup.sh"
bind -T popup M-d run-shell "$TMUX_HOME/scripts/toggle_scratch_popup.sh"

# Prompt popup (for Claude editor)
# Smart toggle - shows/hides popup, or creates via neovim if not exists
bind -n C-p run-shell "$TMUX_HOME/scripts/toggle_prompt_popup.sh"
bind -T popup C-p run-shell "$TMUX_HOME/scripts/toggle_prompt_popup.sh"

# Tasks popup (taskwarrior-tui)
bind -n M-k run-shell "$TMUX_HOME/scripts/toggle_tasks_popup.sh"
bind -T popup M-k run-shell "$TMUX_HOME/scripts/toggle_tasks_popup.sh"

# Reminders popup
bind -n M-q run-shell "$TMUX_HOME/scripts/toggle_reminders_popup.sh"
bind -T popup M-q run-shell "$TMUX_HOME/scripts/toggle_reminders_popup.sh"

# HTTP popup
bind -n M-h run-shell "$TMUX_HOME/scripts/toggle_http_popup.sh"
bind -T popup M-h run-shell "$TMUX_HOME/scripts/toggle_http_popup.sh"

# Obsidian popup
bind -n M-o run-shell "$TMUX_HOME/scripts/toggle_obsidian_popup.sh"
bind -T popup M-o run-shell "$TMUX_HOME/scripts/toggle_obsidian_popup.sh"

bind -n M-n run-shell -b "terminal-notifier -remove ALL > /dev/null"

# This lets us do scrollback and search within the popup
bind -T popup M-s copy-mode

bind -T popup C-p run-shell 'toggle_stateful_popup --dismiss'

# =============================================================================
# = Generic keybindings =======================================================
# =============================================================================
# Reload config file
bind C-r {
  source-file $TMUX_HOME/tmux.conf
  display " Config reloaded"
}

# Rename session and window
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Toggle status
bind g run-shell "$TMUX_HOME/scripts/toggle_status.sh"

# Kill session
bind-key C-q kill-session

bind-key W last-window

# Use another prefix
unbind C-b
set -g prefix C-SPACE
bind C-SPACE send-keys C-SPACE

# =============================================================================
# = For scrolling and copying =================================================
# =============================================================================
# Enable vim mode
set-window-option -g mode-keys vi

# vim-like keys to begin selection
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe 'copy_cmd'

# bind prefix + / to search
bind-key / {
  copy-mode
  send-key ?
}

bind -T copy-mode WheelUpPane send -N1 -X scroll-up
bind -T copy-mode WheelDownPane send -N1 -X scroll-down

bind y {
  copy-mode
  send-keys -X search-backward "http"
  send-keys vE
}

# =============================================================================
# = Status bar & UI  ==========================================================
# =============================================================================
# Begin numbering windows with 1
set -g base-index 1

# Update status every 5 seconds
set-option -g status-interval 5

# Determine if remote or local session
if-shell 'test -n "$SSH_CLIENT"' \
  'set-environment -g IS_REMOTE_SESSION true' \
  'set-environment -gu IS_REMOTE_SESSION'

if-shell 'test -n "$IS_REMOTE_SESSION"' \
  'set -g status-position top' \
  'set -g status-position bottom'

source "$TMUX_HOME/tmux.theme.conf"

if-shell 'test -n "$IS_REMOTE_SESSION"' \
 'set -g status-right "$ts_right_status_remote"' \
 'set -g status-right "$ts_right_status"'

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$IS_REMOTE_SESSION"' \
    'source-file $TMUX_HOME/tmux.remote.conf'

bind n run-shell "$TMUX_HOME/scripts/go_to_next_alert.sh"

set-option -g visual-bell off
set-option -g bell-action other

set-option -g display-time 1500

# Resetting to default needed for reloading config
set -gu status-format
set -gu status

set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''

# =============================================================================
# = Extensions ================================================================
# =============================================================================

source-file "$TMUX_HOME/extensions/bemlo.conf"

# Uncomment to source remote settings for testing
# source-file $TMUX_HOME/tmux.remote.conf
