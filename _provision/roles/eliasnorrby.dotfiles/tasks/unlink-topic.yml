---
- block:
    - debug:
        msg: "Unlinking topic {{ topic.config.path }}"

    - name: topic should NOT be linked to xdg_data_home/dotfiles
      file:
        path: "{{ topic_data_path }}"
        state: absent

    - name: topic should NOT have a directory in xdg_config_home
      file:
        path: "{{ xdg_config_home + '/' + topic_config_dirname }}"
        state: absent

    - name: find the topic's links
      stat:
        path: "{{ link_path }}"
        follow: false
        get_checksum: false
      vars:
        link_path: "{{ (item.dest | default(xdg_config_home + '/' + topic_config_dirname + '/')) | regex_replace('/$', '/' + (item.rename | default(item.src | default(item)))) }}"
      loop: "{{ topic.config.links | default([]) }}"
      register: topic_links

    # Only links into this topic: a present topic may own the same path
    # (bspwm and hyprland both link a `navigate`)
    - name: unlink files
      file:
        path: "{{ item.stat.path }}"
        state: absent
      when:
        - item.stat.islnk | default(false)
        - item.stat.lnk_target.startswith(topic_data_path + '/')
          or item.stat.lnk_target == (item.item.absolute | default(''))
      loop: "{{ topic_links.results }}"
      loop_control:
        label: "{{ item.stat.path | default(item.item) }}"
  vars:
    topic_data_path: "{{ dotfiles_data + '/' + (topic.config.path | replace('/', '.')) + '.topic' }}"
    topic_config_dirname: "{{ topic.config.dirname | default(topic.name) }}"
