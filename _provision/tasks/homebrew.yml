---
- name: tap homebrew taps
  homebrew_tap:
    tap: "{{ brew_taps }}"
    state: present
  when: brew_taps | length > 0

- name: install homebrew formulae
  homebrew:
    name: "{{ brew_formulae }}"
    state: present
  when: brew_formulae | length > 0

- name: install homebrew casks
  homebrew_cask:
    name: "{{ brew_casks }}"
    state: present
  when: brew_casks | length > 0
  ignore_errors: true
