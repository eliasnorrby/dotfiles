---
- name: install packages with pacman
  community.general.pacman:
    name: "{{ pacman_packages }}"
    state: present
    # A package something else pulled in first (go, as yay's makedepend)
    # would otherwise stay a dependency, and show up as an orphan
    reason: explicit
    reason_for: all
  when: pacman_packages | length > 0
  become: yes

- name: install packages from the AUR
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    use: yay
  when: aur_packages | length > 0
  become: yes
  become_user: "{{ aur_builder_user_name }}"
