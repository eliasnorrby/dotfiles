include kitty.local.conf
include theme.conf

modify_font baseline 0

cursor_trail 1

map ctrl+shift+o kitten hints --customize-processing select-and-open.py
map ctrl+shift+r load_config_file

# Always send the CSI-u encoding for shift+return, even to apps that have not
# enabled the kitty keyboard protocol (tmux!). This is the same byte sequence
# the protocol would produce, so protocol-aware apps (claude, nvim) are
# unaffected, and tmux can now see the key and forward it to panes that ask
# for extended keys. Plain zsh maps the sequence back to accept-line in
# keybinds.zsh.
map shift+enter send_text all \x1b[13;2u
