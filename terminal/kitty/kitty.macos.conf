font_size                 14
font_family               Victor Mono
bold_font                 auto
italic_font               auto
bold_italic_font          auto
text_composition_strategy 1.0 0

background_blur 30
hide_window_decorations titlebar-only
window_margin_width 5
mouse_hide_wait -1
macos_option_as_alt yes

# No compositor here, so kitty alone carries the translucency the arch side
# gets from hyprland (0.9) times the theme (0.8).
background_opacity 0.72
