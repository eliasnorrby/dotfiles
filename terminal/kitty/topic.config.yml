---
kitty_config:
  path: terminal/kitty
  links:
    - kitty.conf
    - open-pull-request.py
    - open-linear-ticket.py
    - themes
    - src: kitty.arch.conf
      rename: kitty.local.conf
      condition: "{{ is_arch }}"
    - src: kitty.macos.conf
      rename: kitty.local.conf
      condition: "{{ is_macos }}"
    - src: tmux_kitty.sh
      dest: "{{ xdg_bin_home }}/"
      rename: tmux_kitty
    - src: get_pr_repository_url.sh
      dest: "{{ xdg_bin_home }}/"
      rename: get_pr_repository_url
  brew_casks:
    - kitty
  pacman_packages:
    - kitty
