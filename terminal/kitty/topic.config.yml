---
kitty_config:
  path: terminal/kitty
  links:
    - kitty.conf
    - select-and-open.py
    - src: kitty.arch.conf
      rename: kitty.local.conf
      condition: "{{ is_arch }}"
    - src: kitty.macos.conf
      rename: kitty.local.conf
      condition: "{{ is_macos }}"
    - src: tmux_kitty.sh
      dest: "{{ xdg_bin_home }}/"
      rename: tmux_kitty
    - src: get_pr_repository_url.sh
      dest: "{{ xdg_bin_home }}/"
      rename: get_pr_repository_url
    - src: runner.desktop
      dest: "{{ xdg_applications_dir }}/"
      condition: "{{ is_arch }}"
    - src: dotfiles.desktop
      dest: "{{ xdg_applications_dir }}/"
      condition: "{{ is_arch }}"
    - src: popup.desktop
      dest: "{{ xdg_applications_dir }}/"
      condition: "{{ is_arch }}"
  brew_casks:
    - kitty
  pacman_packages:
    - kitty
