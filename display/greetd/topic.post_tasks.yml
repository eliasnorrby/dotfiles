---
- block:
    - name: symlink greetd config
      file:
        src: "/home/{{ ansible_facts['user_id'] }}/.dotfiles/display/greetd/greetd.toml"
        dest: /etc/greetd/config.toml
        state: link
        force: yes
    - name: enable greetd service
      systemd:
        name: greetd
        enabled: yes
        daemon_reload: yes
  become: yes
  tags: ["never", "sudo_enabled"]

- name: notice about sudo
  debug:
    msg: |
      The tasks for greetd require sudo and have been skipped.

      Please pass the 'sudo_enabled' tag (use the --become flag for the CLI)
      to run them.
  when: "'sudo_enabled' not in ansible_run_tags"
  tags: ["always"]
