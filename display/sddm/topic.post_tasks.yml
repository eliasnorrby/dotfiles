---
- block:
    - name: create sddm config directory
      file:
        path: /etc/sddm.conf.d
        state: directory

    - name: symlink sddm config
      file:
        src: "/home/{{ ansible_facts['user_id'] }}/.dotfiles/display/sddm/sddm.conf"
        dest: /etc/sddm.conf.d/sddm.conf
        state: link
        force: yes

    - name: enable sddm service
      systemd:
        name: sddm
        enabled: yes
  become: yes
  tags: ["never", "sudo_enabled"]

- name: notice about sudo
  debug:
    msg: |
      SDDM post-tasks require sudo and have been skipped.

      Please pass the 'sudo_enabled' tag (use the --become flag for the CLI)
      to run them.

      Manual steps:
      1. Symlink sddm.conf to /etc/sddm.conf.d/sddm.conf
      2. sudo systemctl enable sddm
  when: "'sudo_enabled' not in ansible_run_tags"
  tags: ["always"]
