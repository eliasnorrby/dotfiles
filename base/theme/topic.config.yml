---
theme_config:
  path: base/theme
  links:
    - src: theme.py
      dest: "{{ xdg_bin_home }}/"
      rename: theme
    - src: transition.sh
      dest: "{{ xdg_bin_home }}/"
      rename: theme_transition

# The theme a fresh machine starts on; `theme set` changes it locally.
theme_default: carborange
