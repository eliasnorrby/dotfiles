# {{meta.title}}, rendered by `theme build`. Do not edit; edit the palette.
# wl-kbptr reads this as its config (linked to ~/.config/wl-kbptr/config).
# Colours only: `kbptr` (keyboard/wl_kbptr) passes the modes with -o.
# Colours are #rrggbbaa; every field: `wl-kbptr --help-config`.

[mode_tile]
label_color={{text}}ee
label_select_color={{accent}}
unselectable_bg_color={{crust}}99
selectable_bg_color={{crust}}33
selectable_border_color={{overlay0}}aa
label_font_family=VictorMono Nerd Font

[mode_floating]
# Targets still in play are accent with dark text; the letters already
# typed fade, so the ones left to type stand out. Ruled-out targets fade
# into the dark.
label_color={{accent_fg}}
label_select_color={{accent_fg}}66
unselectable_bg_color={{crust}}66
selectable_bg_color={{accent}}bf
selectable_border_color={{crust}}cc
label_font_family=VictorMono Nerd Font

[mode_bisect]
label_color={{text}}ee
label_font_family=VictorMono Nerd Font
pointer_color={{accent}}
unselectable_bg_color={{crust}}99
even_area_bg_color={{crust}}33
even_area_border_color={{overlay0}}aa
odd_area_bg_color={{surface1}}44
odd_area_border_color={{overlay1}}aa
history_border_color={{surface2}}99

[mode_split]
pointer_color={{accent}}
bg_color={{crust}}66
area_bg_color={{surface1}}55
vertical_color={{text}}aa
horizontal_color={{accent}}aa
history_border_color={{surface2}}99

[mode_drag]
# Where the drag starts, while the end is picked
start_marker_color={{accent}}
