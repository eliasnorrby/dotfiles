# {{meta.title}}, rendered by `theme build`. Do not edit; edit the palette.
# wl-kbptr reads this as its config (linked to ~/.config/wl-kbptr/config).
# Colours only: `kbptr` (keyboard/wl_kbptr) passes the modes with -o.
# Colours are #rrggbbaa; every field: `wl-kbptr --help-config`.

[mode_tile]
label_color={{text}}ee
label_select_color={{accent}}
unselectable_bg_color={{crust}}99
selectable_bg_color={{crust}}33
selectable_border_color={{overlay0}}aa
label_font_family=VictorMono Nerd Font

[mode_floating]
# Targets still in play are grey with light text, the letters already
# typed in the accent. Light text because a label overflows a box smaller
# than itself onto the dimmed app around it, where dark text vanishes.
# Ruled-out targets fade into the dark. The border is drawn replacing the
# box's pixels (not over them), so it takes the box's own colour to
# vanish; at 0 opacity it would cut a see-through outline instead.
label_color={{text}}
label_select_color={{accent}}
unselectable_bg_color={{crust}}66
selectable_bg_color={{surface2}}d9
selectable_border_color={{surface2}}d9
# wl-kbptr always asks for the regular weight, so a heavier one is named
# as a family of its own (fontconfig knows SemiBold this way, not Bold)
label_font_family=VictorMono NFP SemiBold
# Half the box's height, but at least 15 px (12 by default) and at most 100
label_font_size=15 50% 100

[mode_bisect]
label_color={{text}}ee
label_font_family=VictorMono Nerd Font
pointer_color={{accent}}
unselectable_bg_color={{crust}}99
even_area_bg_color={{crust}}33
even_area_border_color={{overlay0}}aa
odd_area_bg_color={{surface1}}44
odd_area_border_color={{overlay1}}aa
history_border_color={{surface2}}99

[mode_split]
pointer_color={{accent}}
bg_color={{crust}}66
area_bg_color={{surface1}}55
vertical_color={{text}}aa
horizontal_color={{accent}}aa
history_border_color={{surface2}}99

[mode_drag]
# Where the drag starts, while the end is picked
start_marker_color={{accent}}
