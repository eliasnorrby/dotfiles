# Managed by dotfiles (base/sshd).
# Symlinked to /etc/ssh/sshd_config.d/10-dotfiles.conf
#
# sshd includes this directory from the top of sshd_config, and the first
# value obtained for a keyword wins. The 10- prefix keeps these ahead of the
# distro drop-ins so they take effect.
#
# The daemon listens on every interface. Reaching it from outside the LAN
# still requires the tailnet, since no port is forwarded at the router.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
