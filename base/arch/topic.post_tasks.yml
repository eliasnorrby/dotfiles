---
- name: configure earlyoom
  block:
    - name: set earlyoom options
      copy:
        dest: /etc/default/earlyoom
        content: |
          # Enable notifications via d-bus (requires systembus-notify)
          # Kill when <10% RAM and <5% swap available
          # Prefer killing node processes (most LSPs)
          EARLYOOM_ARGS="-n -m 10 -s 5 --prefer '^node$'"
      become: true
    - name: enable earlyoom service
      systemd:
        name: earlyoom
        enabled: true
        state: started
      become: true
  tags: ["never", "do_pacman"]

- name: configure swap (zram + swapfile)
  block:
    - name: configure zram-generator (16GB, zstd)
      copy:
        dest: /etc/systemd/zram-generator.conf
        content: |
          # Tuned for 32GB RAM systems
          [zram0]
          zram-size = 16384
          compression-algorithm = zstd
      register: zram_conf

    - name: reload systemd and restart zram
      systemd:
        daemon_reload: true
        name: systemd-zram-setup@zram0.service
        state: restarted
      when: zram_conf.changed

    - name: create and format swapfile (32GB)
      command: mkswap -U clear --size 32G --file /swapfile
      args:
        creates: /swapfile

    - name: add swapfile to fstab
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap defaults,pri=10 0 0'
        state: present

    - name: check if swapfile is active
      command: swapon --show=NAME --noheadings
      register: swapon_show
      changed_when: false

    - name: enable swapfile
      command: swapon --priority=10 /swapfile
      when: "'/swapfile' not in swapon_show.stdout"

  become: true
  tags: ["never", "sudo_enabled"]

- name: configure hibernation (resume from swapfile)
  block:
    - name: get root partition UUID
      command: findmnt -no UUID /
      register: root_uuid
      changed_when: false

    - name: get swapfile physical offset
      shell: filefrag -v /swapfile | awk '$1=="0:" {print substr($4, 1, length($4)-2)}'
      register: swap_offset
      changed_when: false

    - name: add resume hook to mkinitcpio.conf
      replace:
        path: /etc/mkinitcpio.conf
        regexp: '(filesystems)(?!\s+resume)'
        replace: '\1 resume'
      register: mkinitcpio_changed

    - name: add resume kernel params to boot entries
      replace:
        path: "{{ item }}"
        regexp: '^(options\s+(?!.*resume=).*)$'
        replace: >-
          \1 resume=UUID={{ root_uuid.stdout }}
          resume_offset={{ swap_offset.stdout }}
      with_fileglob: /boot/loader/entries/*.conf

    - name: regenerate initramfs
      command: mkinitcpio -P
      when: mkinitcpio_changed.changed

  become: true
  tags: ["never", "sudo_enabled"]

- name: notice about sudo (swap & hibernation)
  debug:
    msg: |
      The swap and hibernation tasks require sudo and have been skipped.
      Run with --tags sudo_enabled --become to apply them.
  when: "'sudo_enabled' not in ansible_run_tags"
  tags: ["always"]
