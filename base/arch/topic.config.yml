---
arch_config:
  path: base/arch
  links:
    - src: toggle_display_brightness.sh
      dest: "{{ xdg_bin_home }}/"
      rename: toggle_display_brightness
    - src: spotifyctl.sh
      dest: "{{ xdg_bin_home }}/"
      rename: spotifyctl
    - src: safe-suspend.sh
      dest: "{{ xdg_bin_home }}/"
      rename: safe-suspend
    - src: chrome-personal.desktop
      dest: "{{ xdg_applications_dir }}/"
    - src: chrome-work.desktop
      dest: "{{ xdg_applications_dir }}/"
    - src: chrome-personal.sh
      dest: "{{ xdg_bin_home }}/"
      rename: chrome-personal
    - src: chrome-work.sh
      dest: "{{ xdg_bin_home }}/"
      rename: chrome-work
    - src: gpg.conf
      dest: ~/.gnupg/
    - src: flameshot.ini
      dest: "{{ xdg_config_home }}/flameshot/"
    - src: mimeapps.list
      dest: "{{ xdg_config_home }}/"
    - autostart.sh
    - src: makepkg.conf
      dest: ~/
      rename: .makepkg.conf
  pacman_packages:
    # base
    - earlyoom
    - systembus-notify # earlyoom notifications
    - vim
    - man-db
    - man-pages
    - base-devel
    - xdg-user-dirs
    - archlinux-contrib
    - sound-theme-freedesktop
    - pavucontrol
    - playerctl
    - libappindicator # tray support for dropbox, among others
    # pacman
    - pacman-contrib
    - rebuild-detector
    # tools
    - ranger
    - python-pillow # for image previews in ranger
    - unzip
    - gucharmap
    - udiskie
    - ddcutil
    - flameshot
    - kdeconnect
    # apps
    - mpv
    - discord
    - obsidian
  aur_packages:
    # pacman
    - informant
    # apps
    - google-chrome
    - spotify
    - dropbox
    - 1password
    - 1password-cli
    - slack-desktop
    - losslesscut-bin

aur_builder_user_name: aur_builder
