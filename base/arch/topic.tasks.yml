---
- name: create gnupg config dir
  file:
    state: directory
    path: ~/.gnupg
    mode: 0700
  tags: ["never", "do_pacman"]

- name: create obsidian vaults dir
  file:
    state: directory
    path: ~/vaults

- name: create flameshot config dir
  file:
    state: directory
    path: ~/.config/flameshot

- name: install yay
  block:
    - name: check if yay is installed
      shell: command -v yay >/dev/null 2>&1
      register: is_yay_installed
      changed_when: false
      failed_when: false
    - name: clone yay repo to /opt
      git:
        repo: https://aur.archlinux.org/yay.git
        dest: /opt/yay
      become: true
      when: is_yay_installed.rc == 1
    - name: set yay directory ownership
      file:
        path: /opt/yay
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        recurse: true
      become: true
      when: is_yay_installed.rc == 1
    - name: build yay package
      shell:
        cmd: makepkg --noconfirm
        chdir: /opt/yay
      when: is_yay_installed.rc == 1
    - name: find built yay package
      find:
        paths: /opt/yay
        patterns: "yay-*.pkg.tar.zst"
      register: yay_package
      when: is_yay_installed.rc == 1
    - name: install yay package
      pacman:
        name: "{{ yay_package.files[0].path }}"
        state: present
      become: true
      when: is_yay_installed.rc == 1 and yay_package.files | length > 0
  tags: ["never", "do_pacman"]

- name: setup aur builder
  block:
    - name: add aur builder user
      user:
        name: "{{ aur_builder_user_name }}"
        group: wheel
        create_home: yes
      become: yes
    - name: set aur builder sudo rights
      lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: "{{ aur_builder_user_name }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: yes
        validate: "visudo -cf %s"
      become: yes
  tags: ["never", "do_pacman"]
