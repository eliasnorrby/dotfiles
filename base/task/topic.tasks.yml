---
- name: create taskwarrior hooks dir
  file:
    state: directory
    path: "~/.task/hooks"

# Taskwarrior loads the first rc file it finds (~/.taskrc, then
# $XDG_CONFIG_HOME/task/taskrc) and writes runtime settings such as
# `context=` back to *that* file. Owning ~/.taskrc locally keeps those
# writes off the symlinked, version-controlled taskrc. blockinfile rather
# than copy, so taskwarrior's own additions below the block survive.
- name: local taskrc should include the dotfiles taskrc
  blockinfile:
    path: "~/.taskrc"
    create: true
    mode: "0644"
    insertbefore: BOF
    marker: "# {mark} MANAGED BY DOTFILES"
    block: |
      # Machine-local taskwarrior config. Runtime settings written by
      # taskwarrior itself (context, `task config`) collect below.
      include ~/.config/task/taskrc
