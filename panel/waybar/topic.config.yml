---
waybar_config:
  path: panel/waybar
  links:
    - config.jsonc
    - style.css
    - power_menu.xml
    - src: scripts/check_updates.sh
      dest: "{{ xdg_bin_home }}/"
      rename: check_updates
    - src: scripts/cpu_graph.py
      dest: "{{ xdg_bin_home }}/"
      rename: cpu_graph
  pacman_packages:
    - waybar
    - otf-font-awesome
