---
xkb_config:
  path: keyboard/xkb
  # Links land in /etc/xkb rather than ~/.config/xkb: libxkbcommon skips the
  # $HOME-based include paths in processes with file capabilities (espanso
  # has cap_dac_override for /dev/input), while /etc/xkb is a fixed path
  # that every consumer (hyprland, espanso, xkbcli) searches. Needs sudo.
  become: true
  links:
    - src: symbols
      dest: "/etc/xkb/"
    - src: rules
      dest: "/etc/xkb/"

