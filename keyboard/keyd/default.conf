[ids]
*
# Espanso's virtual keyboard (id from `keyd monitor`). Left grabbed, its
# injected chords would go through the layers below: the Right Alt it uses
# for AltGr characters ("@" on the Swedish layout) would land in hyper.
-1234:5678:39af7e0e

[global]
# A tap/hold key held longer than this is a plain hold: no tap on release.
# Without it, holding Caps Lock (Control) and letting go sent Escape.
overload_tap_timeout = 200
# Held macro keys (the scroll layer's) repeat after 300 ms, every 80 ms
macro_timeout = 300
macro_repeat_timeout = 80

[main]
# Caps Lock = Control (hold) / Escape (tap)
capslock = overload(control, esc)

# Right Alt = activate hyper layer
rightalt = layer(hyper)

# Right Ctrl = Alt (so there's still an Alt on the right)
rightcontrol = rightalt

# Left Ctrl, free since Caps Lock is Control, is no longer Ctrl (a tap
# would still be a Ctrl press to every app). Tapped, it is F18
# (XF86Launch9 under xkb), which Hyprland binds to kbptr's one click; the
# tap fires on release. Held, it is the mouse layer below.
leftcontrol = overload(mouse, f18)

# Hyper+key sends Ctrl+Shift+Alt+Super+key, which Hyprland can bind to
[hyper:C-S-A-M]
h = left
j = down
k = up
l = right

# macOS-style dashes on the Option-position key (physical Win key, which
# xkb's altwin:swap_lalt_lwin turns into Alt). Emits F13; the xkb option
# elias:dashes maps F13 to endash and Shift+F13 to emdash.
[meta]
minus = f13

[meta+shift]
minus = S-f13

# Left Ctrl held: the mouse layer.
#
# j/k scroll down/up what is under the pointer, two wheel notches at a
# time, from keyd's own virtual pointer. As macros they repeat while held.
# The wheel directions are swapped because Hyprland has natural_scroll on,
# for every pointer. (Not ydotool: keyd grabs its device, for espanso's
# sake, and turns each wheel event into a keypress, which ends the macro's
# repeat.)
#
# The rest send keys nothing else uses, which Hyprland binds to kbptr
# (keyboard/wl_kbptr). Single keys, not chords: keyd plays a chord such as
# C-S-A-M-space as a macro, which would repeat while held.
#   space           f19 (F19)                the click loop, on and off
#   f               scale (XF86LaunchA)      pointer to a grid tile
#   v               config (XF86Tools)       select: drag between two targets
#   esc, Caps Lock  dashboard (XF86LaunchB)  end a stuck overlay
[mouse]
j = macro(scrollup scrollup)
k = macro(scrolldown scrolldown)
space = f19
f = scale
v = config
esc = dashboard
capslock = dashboard
