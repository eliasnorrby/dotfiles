[ids]
*

[main]
# Caps Lock = Control (hold) / Escape (tap)
capslock = overload(control, esc)

# Right Alt = activate hyper layer
rightalt = layer(hyper)

# Right Ctrl = Alt (so there's still an Alt on the right)
rightcontrol = rightalt

# Hyper+key sends Ctrl+Shift+Alt+Super+key, which Hyprland can bind to
[hyper:C-S-A-M]
h = left
j = down
k = up
l = right

# macOS-style dashes on the Option-position key (physical Win key, which
# xkb's altwin:swap_lalt_lwin turns into Alt). Emits F13; the xkb option
# elias:dashes maps F13 to endash and Shift+F13 to emdash.
[meta]
minus = f13

[meta+shift]
minus = S-f13
