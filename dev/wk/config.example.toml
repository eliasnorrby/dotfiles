# wk configuration. Copy to ~/.config/wk/config.toml and fill in.
#
# That file is machine-local on purpose and is not managed by the dotfiles:
# this is where everything specific to a company, a tracker workspace or a
# machine lives, so that no script has to hardcode it. Other scripts can read
# it too:
#
#   wk config get teams.ACME.workspace
#   wk config get 'repos.acme/app.path'
#
# Note: disabling the dev/wk topic removes ~/.config/wk, this file included.

[defaults]
project = "inbox"        # taskwarrior project for tasks nothing else claims
vault = "personal"       # vault for projects without a mapping below
vaults_dir = "~/vaults"
tracker = "linear"       # tracker for issue keys of teams not listed below
merge = "squash"         # how the menu merges a PR: merge, squash, rebase, or "" to ask
# branch_prefix = "me/"  # default: $USER/. Marks a clipboard branch as mine.

[notes]
# Candidates, since vaults need not share a layout: the first one that exists
# in the chosen vault wins; a vault with none gets the first.
subdirs = ["wiki/tasks", "tasks"]
archive = "archive"

# One table per issue-key prefix.
[teams.ACME]
project = "work"         # taskwarrior project that imported issues land in
tracker = "linear"
workspace = "acme"       # linear://<workspace>/issue/ACME-123

# taskwarrior project (its root: work.backend maps via work) -> vault, and
# the directory its tasks open in when they name none of their own.
[projects.work]
vault = "acme"
[projects.dotfiles]
dir = "~/.dotfiles"

# Repositories wk knows about.
[repos."acme/app"]
path = "~/work/acme/app" # the main checkout; worktrees go under .worktrees/
project = "work"         # taskwarrior project for PR-only work items
session = "app"          # tmux session for its windows; default: the basename
sync = true              # include in `wk sync` (required: nothing syncs unscoped)
# merge = "rebase"       # this repository's merge strategy; default: defaults.merge

[github]
team_review_requests = false # also make review items of requests to my teams

[sync]
tracker_interval = 300   # seconds between issue-tracker polls

[start]
prompt = "/lg"           # Claude's first prompt in `wk start`

# Desktop notifications from sync, each on its own switch.
[notify]
review_requested = true
checks_failed = true
reviewed = true          # changes requested, or approved
