# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more

bind = , Delete, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy

bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
# bind = $mainMod, R, exec, $menu
bind = ALT, SPACE, exec, $menu
bind = $mainMod, F, fullscreen, 1
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Seamless navigation between hyprland windows, tmux panes, and vim
bind = $mainMod, H, exec, navigate left
bind = $mainMod, J, exec, navigate down
bind = $mainMod, K, exec, navigate up
bind = $mainMod, L, exec, navigate right

# Move windows with mainMod + SHIFT + hjkl
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Resize windows with mainMod + CTRL + hjkl
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, J, resizeactive, 0 40
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, L, resizeactive, 40 0

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, P, pin
# activate pinned window
# bind = $mainMod SHIFT, P, exec, focus_pinned

# Special paste - type URL identifier and convert to hyperlink
bind = $mainMod SHIFT, P, exec, special_paste

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Notifications
# bind = $mainMod, N, exec, makoctl dismiss
# bind = $mainMod SHIFT, N, exec, makoctl dismiss -a
bind = $mainMod, N, exec, swaync-client --hide-latest
bind = $mainMod SHIFT, N, exec, swaync-client --hide-all
bind = $mainMod, P, exec, swaync-client --toggle-panel

# Keyboard layout
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout all next

# Lock screen
bind = $mainMod CTRL, Q, exec, loginctl lock-session

# Clipboard history
bind = SUPER, C, exec, rofi -modi clipboard:cliphist_rofi_img -show clipboard -show-icons

# Calculator
bind = SUPER, equal, exec, rofi -show calc -modi calc -no-show-match -no-sort | wl-copy

# Voice input
bind = SUPER, R, exec, hyprvoice toggle
bind = SUPER SHIFT, R, exec, hyprvoice cancel

bindr = SUPER, SUPER_L, exec, pgrep which-cmd || kitty -o cursor_trail=0 --class WhichCmd -e which-cmd --config ~/.config/hypr/commands.yml build --exec
windowrule {
  name = "WhichCmd"
  match:class = WhichCmd

  float = on
  size = 1000 250
  dim_around = on
  move = (monitor_w*0.5-1000/2) (monitor_h*0.75)
  opacity = 0.9
  stay_focused = on
  border_size = 3
}

bindr = CTRL SUPER, SUPER_L, exec, tmux display-popup -E -b rounded -y P -w 45% -h 12 -T ' which-cmd ' 'which-cmd --config ~/.config/tmux/commands.yml build --exec'
# vim: ft=hyprlang
