# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = match:class kitty, match:title kitty, float

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

windowrule = match:class lxqt-openssh-askpass, float on

windowrule = match:class ChromePersonal, focus_on_activate on
windowrule = match:class ChromeWork, focus_on_activate on
windowrule = match:class slack, focus_on_activate on
windowrule = match:class notion, focus_on_activate on
# Linear PWA: class is a stable hash of Linear's start URL (same on every
# install). Workspace + HYPER+W rules in apps.conf target this same class.
windowrule = match:class chrome-bgdbmehlmdmddlgneophbcddadgknlpm-Default, focus_on_activate on
windowrule = match:class 1password focus_on_activate on

windowrule {
  name = "Google Meet Picture-in-Picture"
  match:class = ChromeWork
  match:title = Google Meet

  float = on
  pin = on
  size = 400 400
  move = (monitor_w-430) (monitor_h-430)
}

windowrule {
  name = "Flameshot Screenshot Tool"
  match:class = flameshot

  rounding = 0
  float = on
  pin = on
  animation = fade
  move = 0 0
}

# Capture picker (screenshots and recordings)
windowrule {
  name = "CapturePicker"
  match:class = CapturePicker

  # float = on
  # size = (monitor_w*0.6) (monitor_h*0.7)
  # center = on
  opacity = 0.95
}

# vim: ft=hyprlang
