# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,se
    kb_variant =
    kb_model =
    # The list is the menu; switch_layout narrows kb_layout to the active
    # one at runtime (see that script for why groups don't work here).
    # elias:dashes: F13 = endash, Shift+F13 = emdash (keyd sends F13 for
    # Option+hyphen); defined in keyboard/xkb.
    kb_options = altwin:swap_lalt_lwin,elias:dashes
    kb_rules =
    repeat_rate = 75
    repeat_delay = 400

    natural_scroll = true

    follow_mouse = 1
    special_fallthrough = false

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Force ydotool to use US layout (it always sends US keycodes)
device {
    name = ydotoold-virtual-device
    kb_layout = us
    kb_variant =
    kb_options =
}

# Espanso injects keycodes for the first layout in its config (US) and
# sends anything non-ASCII via the clipboard, so its keyboard is pinned to
# US regardless of the active layout. Only works while keyd leaves the
# device alone (see keyboard/keyd). No options: espanso expects plain
# Alt/AltGr.
device {
    name = espanso-virtual-device
    kb_layout = us
    kb_variant =
    kb_options =
}

