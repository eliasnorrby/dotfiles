# The cover theme_transition puts over the screen while a theme switch runs
# underneath (base/theme/transition.sh): a float at the origin, mapped
# without animation, drawn opaque, no decoration. The script makes it
# fullscreen through the dispatcher (the rule form does not take on this
# version). Lives in the config rather than being set at runtime, because
# the switch itself reloads hyprland and a runtime rule would not survive.
windowrule {
  name = "ThemeCover"
  match:class = ThemeCover

  float = on
  size = 100% 100%
  move = 0 0
  no_anim = on
  no_blur = on
  no_shadow = on
  no_dim = on
  border_size = 0
  opaque = on
  no_initial_focus = on
}
