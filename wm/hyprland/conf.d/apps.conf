bind = SUPER, RETURN, exec, $terminal
windowrule = opacity 0.9 0.9, class:^(kitty)$

bind = $hyper, T, exec, focus_or_run TmuxKitty tmux_kitty
windowrulev2 = workspace 1, class:^(TmuxKitty)$
windowrule = opacity 0.9 0.9, class:^(TmuxKitty)$

bind = $hyper, C, exec, focus_or_run chrome-personal.desktop
windowrulev2 = workspace 2, class:^(ChromePersonal)$

bind = $hyper, W, exec, focus_or_run chrome-work.desktop
windowrulev2 = workspace 3, class:^(ChromeWork)$

bind = $hyper, Z, exec, focus_or_run Slack slack
windowrulev2 = workspace 4, class:^(Slack)$

bind = $hyper, U, exec, focus_or_run spotify
windowrulev2 = workspace 5, class:^(spotify)$

bind = $hyper, O, exec, focus_or_run obsidian
windowrulev2 = workspace 6, class:^(obsidian)$
windowrule = opacity 0.9 0.9, class:^(obsidian)$

bind = $hyper, M, exec, focus_or_run btop.desktop
windowrulev2 = workspace 7, class:^(BtopKitty)$
windowrule = opacity 0.9 0.9, class:^(BtopKitty)$

# Taskwarrior scratchpad
bind = $hyper, G, exec, focus_or_run taskwarrior-tui.desktop
windowrulev2 = workspace special:tasks, class:^(TaskwarriorTui)$
windowrulev2 = float, class:^(TaskwarriorTui)$
windowrulev2 = size 80% 80%, class:^(TaskwarriorTui)$
windowrulev2 = center, class:^(TaskwarriorTui)$
windowrulev2 = opacity 0.9 0.9, class:^(TaskwarriorTui)$

# Scratch terminal (pinned right)
bind = $hyper, D, exec, focus_or_run scratch.desktop
windowrulev2 = workspace special:scratch, class:^(ScratchKitty)$
windowrulev2 = float, class:^(ScratchKitty)$
windowrulev2 = size 25% 60%, class:^(ScratchKitty)$
windowrulev2 = move 73% 15%, class:^(ScratchKitty)$
windowrulev2 = opacity 0.9 0.9, class:^(ScratchKitty)$

bind = $hyper, A, exec, focus_or_run chromium

# tmux window select
bind = $hyper, 1, exec, tmux select-window -t 1
bind = $hyper, 2, exec, tmux select-window -t 2
bind = $hyper, 3, exec, tmux select-window -t 3
bind = $hyper, 4, exec, tmux select-window -t 4
bind = $hyper, 5, exec, tmux select-window -t 5
bind = $hyper, 6, exec, tmux select-window -t 6
bind = $hyper, 7, exec, tmux select-window -t 7
bind = $hyper, 8, exec, tmux select-window -t 8
bind = $hyper, 9, exec, tmux select-window -t 9

# vim: ft=hyprlang
