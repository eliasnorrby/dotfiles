bind = SUPER, RETURN, exec, $terminal
windowrule = match:class kitty, opacity 0.9 0.9

bind = $hyper, T, exec, focus_or_run TmuxKitty tmux_kitty
windowrule {
  name = "TmuxKitty"
  match:class = TmuxKitty

  workspace = 1
  opacity = 0.9
}

bind = $hyper, R, exec, focus_or_run runner.desktop
windowrule {
  name = "RunnerKitty"
  match:class = RunnerKitty

  workspace = special:runner
  opacity = 0.9
}

bind = $hyper, C, exec, focus_or_run chrome-personal.desktop
windowrule = match:class ChromePersonal, workspace 2

bind = $hyper, X, exec, focus_or_run chrome-work.desktop
windowrule = match:class ChromeWork, workspace 3

bind = $hyper, Z, exec, focus_or_run Slack slack
windowrule = match:class Slack, workspace 4
windowrule = match:class Slack, opacity 0.97

bind = $hyper, M, exec, focus_or_run teams-for-linux /opt/teams-for-linux/teams-for-linux
windowrule = match:class teams-for-linux, workspace 5
windowrule = match:class teams-for-linux, opacity 0.97

# Google Meet PWA
bind = $hyper, A, exec, focus_or_run google-meet.desktop
windowrule = match:class chrome-kjgfgldnnfoeklkmfkjfagphfepbbdan-Default, workspace 5

# Linear PWA
bind = $hyper, W, exec, focus_or_run linear.desktop
windowrule = match:class chrome-bgdbmehlmdmddlgneophbcddadgknlpm-Default, workspace 11

bind = $hyper, U, exec, focus_or_run spotify
windowrule = match:class spotify, workspace 6
windowrule = match:class spotify, opacity 0.90

bind = $hyper, O, exec, focus_or_run obsidian
windowrule {
  name = "Obsidian"
  match:class = obsidian

  workspace = 7
  opacity = 0.95
}

bind = $hyper, V, exec, focus_or_run Notion notion-app
windowrule {
  name = "Notion"
  match:class = Notion

  workspace = 7
  opacity = 0.95
}

bind = $hyper, I, exec, focus_or_run btop.desktop
windowrule {
  name = "BtopKitty"
  match:class = BtopKitty

  workspace = 8
  opacity = 0.9
}

bind = $hyper, Q, exec, focus_or_run Claude claude-desktop
windowrule {
  name = "ClaudeDesktop"
  match:class = Claude

  workspace = 10
  opacity = 0.95
}

bind = $hyper, P, exec, 1password --quick-access

# Dotfiles
bind = $hyper, E, exec, focus_or_run dotfiles.desktop
windowrule {
  name = "DotfilesKitty"
  match:class = DotfilesKitty

  workspace = 9
  opacity = 0.9
}

# Taskwarrior scratchpad
bind = ALT, G, exec, focus_or_run taskwarrior-tui.desktop
bind = $hyper, G, exec, focus_or_run taskwarrior-tui.desktop
windowrule {
  name = "TaskwarriorTui"
  match:class = TaskwarriorTui

  workspace = special:tasks
  float = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  center = on
  opacity = 0.9
}

# Scratch terminal (pinned right)
bind = ALT, D, exec, focus_or_run scratch.desktop
bind = $hyper, D, exec, focus_or_run scratch.desktop
windowrule {
  name = "ScratchKitty"
  match:class = ScratchKitty

  workspace = special:scratch
  float = on
  size = (monitor_w*0.25) (monitor_h*0.6)
  move = (monitor_w*0.73) (monitor_h*0.15)
  opacity = 0.9
}

# send window to its 'home' workspace (based on windowrules)
bind = SUPER SHIFT, H, exec, send_home

# tmux window select
bind = $hyper, 1, exec, tmux select-window -t 1
bind = $hyper, 2, exec, tmux select-window -t 2
bind = $hyper, 3, exec, tmux select-window -t 3
bind = $hyper, 4, exec, tmux select-window -t 4
bind = $hyper, 5, exec, tmux select-window -t 5
bind = $hyper, 6, exec, tmux select-window -t 6
bind = $hyper, 7, exec, tmux select-window -t 7
bind = $hyper, 8, exec, tmux select-window -t 8
bind = $hyper, 9, exec, tmux select-window -t 9

# vim: ft=hyprlang
