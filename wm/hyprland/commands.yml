keys:
  - key: p
    name: special paste
    value: special_paste
  - key: a
    name: apps
    keys:
      - key: t
        name: terminal
        value: kitty

  - key: h
    name: hypr
    keys:
      - key: c
        name: clients
        value: kitty -e browse_clients
      - key: e
        name: exit
        value: hyprctl dispatch exit
  - key: r
    name: reload
    keys:
      - key: h
        name: hyprland
        value: hyprctl reload
      - key: w
        name: waybar
        value: pkill -USR2 waybar
      - key: p
        name: pacman updates
        value: pkill -RTMIN+8 waybar
      - key: m
        name: mako
        value: makoctl reload
      - key: s
        name: swaync
        value: swaync-client --reload && swaync-client --reload-css
      - key: a
        name: all
        value: reload_services
  - key: t
    name: toggle
    keys:
      - key: w
        name: waybar
        value: pkill -USR1 waybar
      - key: b
        name: brightness
        value: toggle_display_brightness
      - key: l
        name: layout
        value: hyprctl switchxkblayout all next
      - key: d
        name: dnd
        value: swaync-client --toggle-dnd
  - key: s
    name: screenshot
    keys:
      - key: f
        name: full
        value: sleep 0.2 && grim - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy
      - key: r
        name: region
        value: grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy
      - key: a
        name: annotated
        value: grim -g "$(slurp)" - | satty --filename -
      - key: q
        name: flameshot
        value: flameshot gui
      - key: p
        name: pick
        value: capture_picker CapturePicker ~/Pictures/Screenshots
  - key: v
    name: screen recording
    keys:
      - key: f
        name: full
        value: screen_record fullscreen
      - key: r
        name: region
        value: screen_record region
      - key: s
        name: stop
        value: screen_record stop
      - key: p
        name: pick
        value: capture_picker CapturePicker ~/Videos/Recordings
  - key: l
    name: lock
    value: loginctl lock-session
  - key: P
    name: power
    keys:
      - key: s
        name: suspend
        value: systemctl suspend
      - key: h
        name: hibernate
        value: systemctl hibernate
      - key: r
        name: reboot
        value: systemctl reboot
      - key: o
        name: shutdown
        value: systemctl poweroff
