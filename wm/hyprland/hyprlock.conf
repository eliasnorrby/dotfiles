# Catppuccin Macchiato theme

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(24, 25, 38, 1.0)
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(202, 211, 245, 1.0)
    font_size = 72
    font_family = Noto Sans
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(165, 173, 203, 1.0)
    font_size = 24
    font_family = Noto Sans
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(245, 169, 127, 1.0)
    inner_color = rgba(54, 58, 79, 1.0)
    font_color = rgba(202, 211, 245, 1.0)
    fade_on_empty = false
    placeholder_text =
    position = 0, -80
    halign = center
    valign = center
}

# vim: ft=hyprlang
