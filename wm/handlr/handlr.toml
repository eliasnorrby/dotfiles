enable_selector = true
selector = "handlr-selector"

# Work domains - auto-route to work browser
[[handlers]]
exec = "chrome-work %U"
terminal = false
regexes = ['https?://github\.com/bemlo(/.*)?','https?://app\.bemlo\.com(/.*)?','https?://console\.cloud\.google\.com(/.*)?']

[[handlers]]
exec = "chrome-personal %U"
terminal = false
regexes = ['https?://github\.com/eliasnorrby(/.*)?']

# Notion - open deep links in the native Notion desktop app
[[handlers]]
exec = "notion-open %U"
terminal = false
regexes = ['https?://([a-z0-9-]+\.)?notion\.(so|com)(/.*)?']

# Linear - open in the PWA window (no native app / scheme on Linux)
[[handlers]]
exec = "linear-open %U"
terminal = false
regexes = ['https?://linear\.app(/.*)?']
